<!DOCTYPE html>
<html>
<head>
    <title>Task Dashboard</title>
</head>

<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<body>

<h1>Dashboard</h1>

<p>
    Welcome {{ request.user.username }}
</p>

<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">
        Logout
    </button>
</form>

<hr>

{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}

<h2>Todo List</h2>

<input
    type="text"
    name="q"
    placeholder="Search Todos"

    hx-get="{% url 'search-todos' %}"
    hx-trigger="keyup changed delay:500ms"
    hx-target="#todo-list"
>

{% if request.user.groups.all.0.name == "Manager" %}

   <button
    hx-get="{% url 'create-todo' %}"
    hx-target="#create-form"
   
>
    Create Todo
</button>

<div id="create-form"></div>

<hr>

{% endif %}

<hr>
<div id="todo-list">

    {% for todo in todos %}
        {% include "todo_row.html" %}

        {% empty %}
            <p>No todos yet.</p>
    {% endfor %}

</div>

</body>

<script>

document.body.addEventListener(
    "todoCreated",
    function () {

        document.getElementById(
            "create-form"
        ).innerHTML = "";

    }
);

</script>

</html>
